<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PRIME BRONGE | Gaming</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>

    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: 'Orbitron', sans-serif;
      background: #030305;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }


    /* =========================
       ANIMATED BACKGROUND
    ========================= */

    .bg-effects {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(255, 0, 70, 0.08),
          transparent 35%
        );
    }


    /* Background Grid */

    .bg-effects::before {
      content: "";
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        );

      background-size: 45px 45px;

      mask-image: linear-gradient(
        to bottom,
        transparent,
        black 20%,
        black 80%,
        transparent
      );
    }


    /* Glowing Orbs */

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(75px);
      opacity: .55;

      animation:
        floatOrb 9s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 300px;
      height: 300px;

      background: rgba(255, 0, 70, .23);

      top: -100px;
      left: -100px;
    }

    .orb-2 {
      width: 380px;
      height: 380px;

      background: rgba(110, 0, 255, .16);

      right: -140px;
      top: 25%;

      animation-delay: -3s;
    }

    .orb-3 {
      width: 280px;
      height: 280px;

      background: rgba(255, 20, 80, .18);

      bottom: -100px;
      left: 35%;

      animation-delay: -5s;
    }


    @keyframes floatOrb {

      0% {
        transform:
          translate(0, 0)
          scale(1);
      }

      50% {
        transform:
          translate(80px, 40px)
          scale(1.15);
      }

      100% {
        transform:
          translate(-40px, -60px)
          scale(.9);
      }

    }


    /* =========================
       MOVING LIGHT BEAMS
    ========================= */

    .light-beam {
      position: absolute;

      width: 2px;
      height: 140%;

      top: -20%;

      opacity: .25;

      filter: blur(2px);

      background:
        linear-gradient(
          transparent,
          #ff174f,
          transparent
        );

      transform: rotate(25deg);

      animation:
        beamMove 8s linear infinite;
    }

    .beam-1 {
      left: 15%;
    }

    .beam-2 {
      right: 20%;

      animation-delay: -4s;

      opacity: .14;
    }


    @keyframes beamMove {

      0% {
        transform:
          translateX(-600px)
          rotate(25deg);
      }

      100% {
        transform:
          translateX(900px)
          rotate(25deg);
      }

    }


    /* =========================
       FLOATING PARTICLES
    ========================= */

    .particles span {
      position: absolute;

      width: 3px;
      height: 3px;

      background: #ff315e;

      border-radius: 50%;

      box-shadow:
        0 0 10px #ff174f,
        0 0 20px rgba(255,0,70,.5);

      animation:
        particleFloat linear infinite;
    }


    .particles span:nth-child(1) {
      left: 5%;
      top: 80%;
      animation-duration: 7s;
    }

    .particles span:nth-child(2) {
      left: 12%;
      top: 30%;
      animation-duration: 9s;
    }

    .particles span:nth-child(3) {
      left: 20%;
      top: 65%;
      animation-duration: 6s;
    }

    .particles span:nth-child(4) {
      left: 28%;
      top: 15%;
      animation-duration: 8s;
    }

    .particles span:nth-child(5) {
      left: 35%;
      top: 85%;
      animation-duration: 10s;
    }

    .particles span:nth-child(6) {
      left: 43%;
      top: 40%;
      animation-duration: 7s;
    }

    .particles span:nth-child(7) {
      left: 50%;
      top: 75%;
      animation-duration: 9s;
    }

    .particles span:nth-child(8) {
      left: 58%;
      top: 20%;
      animation-duration: 6s;
    }

    .particles span:nth-child(9) {
      left: 65%;
      top: 60%;
      animation-duration: 8s;
    }

    .particles span:nth-child(10) {
      left: 72%;
      top: 10%;
      animation-duration: 7s;
    }

    .particles span:nth-child(11) {
      left: 78%;
      top: 80%;
      animation-duration: 10s;
    }

    .particles span:nth-child(12) {
      left: 84%;
      top: 35%;
      animation-duration: 6s;
    }

    .particles span:nth-child(13) {
      left: 90%;
      top: 70%;
      animation-duration: 9s;
    }

    .particles span:nth-child(14) {
      left: 95%;
      top: 20%;
      animation-duration: 7s;
    }

    .particles span:nth-child(15) {
      left: 40%;
      top: 5%;
      animation-duration: 8s;
    }

    .particles span:nth-child(16) {
      left: 60%;
      top: 90%;
      animation-duration: 6s;
    }


    @keyframes particleFloat {

      0% {
        transform:
          translateY(50px)
          scale(.5);

        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      80% {
        opacity: .8;
      }

      100% {
        transform:
          translateY(-170px)
          scale(1);

        opacity: 0;
      }

    }


    /* =========================
       MAIN CARD
    ========================= */

    .card {

      width: min(92%, 600px);

      padding:
        45px 30px 35px;

      margin: 30px 0;

      text-align: center;

      background:
        linear-gradient(
          145deg,
          rgba(15,15,18,.92),
          rgba(5,5,7,.88)
        );

      border:
        1px solid rgba(255,255,255,.10);

      border-radius: 25px;

      backdrop-filter: blur(18px);

      -webkit-backdrop-filter: blur(18px);

      box-shadow:

        0 0 40px rgba(0,0,0,.85),

        0 0 100px
        rgba(255,0,70,.07),

        inset 0 0 30px
        rgba(255,255,255,.015);

      position: relative;

      z-index: 5;

      overflow: hidden;
    }


    /* Card Glow */

    .card::before {

      content: "";

      position: absolute;

      top: -2px;
      left: 15%;

      width: 70%;
      height: 2px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #ff174f,
          transparent
        );

      box-shadow:
        0 0 20px #ff174f,
        0 0 50px #ff174f;

      animation:
        cardGlow 3s ease-in-out infinite;
    }


    @keyframes cardGlow {

      0%,100% {
        opacity: .4;
      }

      50% {
        opacity: 1;
      }

    }


    /* =========================
       TOP LINE
    ========================= */

    .top-line {

      width: 100px;
      height: 3px;

      margin:
        0 auto 30px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #ff174f,
          transparent
        );

      box-shadow:
        0 0 15px #ff174f;
    }


    /* =========================
       LOGO
    ========================= */

    .logo-box {

      width: 145px;
      height: 145px;

      margin: auto;

      border-radius: 50%;

      padding: 5px;

      background:
        linear-gradient(
          135deg,
          #ff174f,
          #ff004c,
          #5b0019
        );

      box-shadow:

        0 0 25px
        rgba(255,0,70,.5),

        0 0 70px
        rgba(255,0,70,.15);

      animation:
        logoPulse 2.5s
        infinite ease-in-out;
    }


    .logo-box img {

      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 50%;

      background: #080808;

      display: block;
    }


    @keyframes logoPulse {

      0%,100% {

        box-shadow:
          0 0 25px
          rgba(255,0,70,.5);
      }

      50% {

        box-shadow:
          0 0 45px
          rgba(255,0,70,.85);
      }

    }


    /* =========================
       NAME
    ========================= */

    .name {

      margin-top: 25px;

      font-size:
        clamp(30px, 7vw, 52px);

      font-weight: 900;

      letter-spacing: 3px;

      color: #fff;

      text-shadow:

        0 0 10px
        rgba(255,255,255,.3),

        0 0 25px
        rgba(255,0,70,.5);
    }


    .tag {

      margin-top: 8px;

      font-size: 12px;

      letter-spacing: 5px;

      color: #ff315e;

      font-weight: 700;
    }


    /* =========================
       BIO
    ========================= */

    .bio {

      max-width: 470px;

      margin:
        25px auto 30px;

      color: #aaa;

      font-family: Arial, sans-serif;

      font-size: 15px;

      line-height: 1.7;
    }

    .bio b {
      color: #fff;
    }


    /* =========================
       SOCIAL TITLE
    ========================= */

    .social-title {

      font-size: 12px;

      letter-spacing: 4px;

      color: #777;

      margin-bottom: 15px;
    }


    /* =========================
       SOCIAL BUTTONS
    ========================= */

    .socials {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;
    }


    .social-btn {

      position: relative;

      height: 58px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 12px;

      color: #fff;

      text-decoration: none;

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius: 12px;

      background:
        rgba(255,255,255,.035);

      overflow: hidden;

      transition:
        .3s ease;

      font-size: 13px;

      font-weight: 700;
    }


    /* Button Shine */

    .social-btn::before {

      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.10),
          transparent
        );

      transform:
        translateX(-100%);

      transition: .5s;
    }


    .social-btn:hover::before {

      transform:
        translateX(100%);
    }


    .social-btn:hover {

      transform:
        translateY(-5px);

      border-color:
        #ff174f;

      box-shadow:

        0 8px 25px
        rgba(255,0,70,.20),

        inset 0 0 20px
        rgba(255,0,70,.05);
    }


    .social-btn i {

      font-size: 21px;

      transition: .3s;
    }


    .social-btn:hover i {

      transform:
        scale(1.2);

      filter:
        drop-shadow(
          0 0 8px currentColor
        );
    }


    /* Platform Colors */

    .youtube i {
      color: #ff0033;
    }

    .tiktok i {
      color: #fff;
    }

    .instagram i {
      color: #ff4f9a;
    }

    .facebook i {
      color: #1877f2;
    }


    /* =========================
       HANDLE
    ========================= */

    .handle {

      margin-top: 25px;

      font-family: Arial, sans-serif;

      color: #666;

      font-size: 13px;
    }


    .handle span {

      color: #ff315e;

      font-weight: bold;

      text-shadow:
        0 0 10px
        rgba(255,0,70,.4);
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {

      margin-top: 25px;

      padding-top: 20px;

      border-top:
        1px solid
        rgba(255,255,255,.07);

      color: #444;

      font-family: Arial, sans-serif;

      font-size: 11px;

      letter-spacing: 1px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {

      .card {

        padding:
          35px 18px 25px;
      }


      .logo-box {

        width: 125px;
        height: 125px;
      }


      .socials {

        grid-template-columns: 1fr;
      }


      .name {

        letter-spacing: 2px;
      }


      .tag {

        font-size: 9px;

        letter-spacing: 3px;
      }

    }


    /* =========================
       REDUCED MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration: 0.01ms !important;

        animation-iteration-count: 1 !important;

        scroll-behavior: auto !important;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       ANIMATED BACKGROUND
  ========================= -->

  <div class="bg-effects">

    <div class="orb orb-1"></div>

    <div class="orb orb-2"></div>

    <div class="orb orb-3"></div>


    <div class="light-beam beam-1"></div>

    <div class="light-beam beam-2"></div>


    <div class="particles">

      <span></span>
      <span></span>
      <span></span>
      <span></span>

      <span></span>
      <span></span>
      <span></span>
      <span></span>

      <span></span>
      <span></span>
      <span></span>
      <span></span>

      <span></span>
      <span></span>
      <span></span>
      <span></span>

  </div>



  <!-- =========================

  <main class="card">

    <!-- =========================

    <div class="socials">

      <a

  </main>


</body>
</html>
