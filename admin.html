<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUDO_ADMIN // root</title>
<style>
:root{
 --bg:#010a04;--pn:rgba(2,18,9,.88);--ln:#0e5a2c;--ln2:#16864a;
 --g:#00ff66;--g2:#8dffbb;--tx:#b9ffd6;--mut:#4fae77;
 --red:#ff2e55;--amb:#ffb800;--cy:#00e5ff;--pu:#c77dff;
 --c0:#ff2e4d;--c1:#00e676;--c2:#ffd400;--c3:#2aa8ff;
 --mono:"JetBrains Mono","Fira Code","Cascadia Code","Source Code Pro",Consolas,Menlo,"Noto Sans Bengali","Courier New",monospace;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#0e5a2c #010a04}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--tx);font:13px/1.5 var(--mono)}
::selection{background:var(--g);color:#001a0a}
#mx{position:fixed;inset:0;z-index:0;opacity:.3;pointer-events:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:90;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
header,main,#ts{position:relative;z-index:2}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:rgba(1,10,4,.93);border-bottom:1px solid var(--ln2);box-shadow:0 0 22px #00ff6622;position:sticky;top:0;z-index:50}
.brand{font-size:18px;font-weight:800;letter-spacing:.14em;color:var(--g);text-shadow:0 0 8px #00ff6699;animation:gt 7s infinite}
.brand span{color:var(--cy)}
@keyframes gt{0%,92%,100%{text-shadow:0 0 8px #00ff6699;transform:none}93%{text-shadow:2px 0 #ff2e55,-2px 0 #00e5ff;transform:translateX(1px)}95%{text-shadow:-2px 0 #ff2e55,2px 0 #00e5ff;transform:translateX(-1px)}97%{text-shadow:0 0 8px #00ff6699}}
.logo{display:grid;grid-template:1fr 1fr/1fr 1fr;gap:2px;width:22px;height:22px}.logo i{box-shadow:0 0 6px currentColor}
.ps{color:var(--mut);font-size:12px}.ps b{color:var(--g)}
.cur{display:inline-block;width:.6em;height:1.05em;background:var(--g);vertical-align:-2px;margin-left:3px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
header .sp{flex:1}

/* ---------- chips / buttons / inputs ---------- */
.chip{font-size:11px;padding:1px 7px;border:1px solid var(--ln2);color:var(--mut);white-space:nowrap;letter-spacing:.05em;border-radius:2px}
.chip::before{content:"[";margin-right:3px;opacity:.6}.chip::after{content:"]";margin-left:3px;opacity:.6}
.chip.ok{color:var(--g);border-color:var(--g);text-shadow:0 0 6px #00ff6688}
.chip.no{color:var(--red);border-color:var(--red)}
.chip.lv{color:var(--cy);border-color:var(--cy)}
.chip.lo{color:var(--amb);border-color:var(--amb)}
.chip.wn,.chip.pu{color:var(--pu);border-color:var(--pu)}
button{font:inherit;font-size:12px;cursor:pointer;background:transparent;color:var(--g);border:1px solid var(--ln2);border-radius:2px;padding:6px 10px;text-transform:uppercase;letter-spacing:.06em;transition:background .15s,box-shadow .15s,border-color .15s}
button:hover:not(:disabled){border-color:var(--g);background:#00ff6618;box-shadow:0 0 10px #00ff6655}
button.on{background:var(--g);border-color:var(--g);color:#001a0a;font-weight:700;box-shadow:0 0 12px #00ff6688}
button.dg{color:var(--red);border-color:#7a1a2e}button.dg:hover:not(:disabled){border-color:var(--red);background:#ff2e5518;box-shadow:0 0 10px #ff2e5566}
button:disabled{opacity:.3;cursor:not-allowed}
:focus-visible{outline:1px solid var(--cy);outline-offset:1px}
input[type=text],input[type=number],input[type=password]{width:100%;padding:6px 9px;background:#00140a;color:var(--g2);border:1px solid var(--ln);border-radius:2px;font:inherit;caret-color:var(--g)}
input[type=text]:focus,input[type=number]:focus,input[type=password]:focus{border-color:var(--g);box-shadow:0 0 8px #00ff6644;outline:0}
input[type=checkbox]{accent-color:var(--g);width:15px;height:15px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.row>.hint{flex:0 1 auto}
.hint{color:var(--mut);font-size:11.5px}.hint.ctr{text-align:center}
h4{margin:14px 0 6px;font-size:11.5px;color:var(--g);font-weight:600;letter-spacing:.14em;text-transform:uppercase}h4::before{content:"// ";color:var(--mut)}
.big{font-size:19px;letter-spacing:.08em;color:var(--g);text-shadow:0 0 8px #00ff6677}
.empty{color:var(--mut);padding:26px 8px;text-align:center}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:270px minmax(320px,1fr) 370px;gap:20px;padding:24px 14px 18px;align-items:start;max-width:1520px;margin:0 auto}
@media(max-width:1050px){main{grid-template-columns:1fr}
 .col{display:contents}.col>aside:nth-child(1){order:1}#mid{order:2}#side{order:3}.col>aside:nth-child(2){order:4}.col>aside:nth-child(3){order:5}}   /* phone: matches > board > control > queue > log */
.col{display:flex;flex-direction:column;gap:22px}
.box{position:relative;background:var(--pn);border:1px solid var(--ln);padding:16px 12px 12px;border-radius:2px;box-shadow:0 0 0 1px #00ff6610 inset,0 0 20px #00ff6612}
.box::before{content:"[ " attr(data-t) " ]";position:absolute;top:-9px;left:12px;background:var(--bg);color:var(--g);padding:0 6px;font-size:11px;letter-spacing:.16em}
.box::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-right:2px solid var(--g);border-bottom:2px solid var(--g);opacity:.7}

/* ---------- match list ---------- */
.seg{display:flex}.seg button{border-radius:0;flex:1;padding:6px 4px;margin-left:-1px}.seg button:first-child{margin-left:0}
.m{padding:8px 10px;border:1px solid var(--ln);margin-top:8px;cursor:pointer;background:#00140a;transition:border-color .15s,box-shadow .15s}
.m:hover{border-color:var(--ln2)}
.m.on{border-color:var(--g);box-shadow:0 0 0 1px var(--g) inset,0 0 14px #00ff6633;background:#02240f}
.m.stale{opacity:.5}
.m b{font-size:17px;letter-spacing:.08em;color:var(--g)}
.m small{display:block;color:var(--mut);margin-top:3px;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lf2{display:flex;justify-content:space-between;gap:8px;margin:3px 0}.lf2 span{color:var(--mut)}
#lgb{max-height:190px;overflow:auto;font-size:11.5px;line-height:1.45}
#lgb div{padding:1px 0;word-break:break-word}#lgb .tm{color:var(--mut)}#lgb .err{color:var(--red)}#lgb .warn{color:var(--amb)}#lgb .ok{color:var(--g)}

/* ---------- turn banner + board ---------- */
#turn{display:flex;align-items:center;gap:10px;max-width:620px;margin:0 auto 12px;padding:8px 14px;border:1px solid var(--gc,var(--g));background:color-mix(in srgb,var(--gc,#00ff66) 12%,#010a04);box-shadow:0 0 14px color-mix(in srgb,var(--gc,#00ff66) 40%,transparent)}
#turn i{width:12px;height:12px;border-radius:50%;background:var(--gc);box-shadow:0 0 10px 3px var(--gc);flex:none}
#turn b{font-size:15px;color:#fff;letter-spacing:.04em}#turn>span{color:var(--mut);margin-left:auto;font-size:11.5px;text-align:right}
#bw{max-width:620px;margin:0 auto;padding:10px;background:#000;border:1px solid var(--ln2);box-shadow:0 0 28px #00ff6624,0 0 0 1px #00ff6622 inset}
#bd{position:relative;width:100%;aspect-ratio:1;background:#020d06;user-select:none;touch-action:manipulation}
.c{position:absolute;width:6.667%;height:6.667%;border:1px solid #0b3b20;display:flex;align-items:center;justify-content:center;font-size:clamp(9px,1.9vw,14px);color:#35a063;cursor:pointer;background:#031209}
.c:hover{outline:1px solid var(--g);outline-offset:-1px;background:#00ff6622;z-index:3}
.c.p{background:#041a0d}
.c.s0{background:color-mix(in srgb,var(--c0) 78%,#000)}.c.s1{background:color-mix(in srgb,var(--c1) 78%,#000)}.c.s2{background:color-mix(in srgb,var(--c2) 78%,#000)}.c.s3{background:color-mix(in srgb,var(--c3) 78%,#000)}
.c.h0{background:color-mix(in srgb,var(--c0) 55%,#020d06)}.c.h1{background:color-mix(in srgb,var(--c1) 55%,#020d06)}.c.h2{background:color-mix(in srgb,var(--c2) 55%,#020d06)}.c.h3{background:color-mix(in srgb,var(--c3) 55%,#020d06)}
.c .ar{font-size:clamp(11px,2.4vw,18px);line-height:1;font-weight:700;text-shadow:0 0 6px currentColor}
.yd{position:absolute;width:40%;height:40%;cursor:pointer;background:color-mix(in srgb,var(--gc) 72%,#000);border:1px solid #000;transition:box-shadow .25s,opacity .25s,filter .25s}
.yd b{position:absolute;inset:16.67%;background:#020d06;border:1px solid color-mix(in srgb,var(--gc) 60%,#000);pointer-events:none}
.yd i{position:absolute;width:18.4%;height:18.4%;border-radius:50%;background:color-mix(in srgb,var(--gc) 35%,#020d06);border:1px solid var(--gc);pointer-events:none}
.yd em{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-style:normal;font-weight:700;font-size:clamp(9px,1.8vw,12px);color:#fff;background:#000c;border:1px solid var(--gc);padding:1px 8px;max-width:88%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.yd em:empty{display:none}
.yd.turn{z-index:4;box-shadow:0 0 0 2px #fff7,0 0 22px 6px var(--gc);animation:gl 1.4s ease-in-out infinite alternate}
.yd.turn em{background:#fff;color:#001a0a}
@keyframes gl{to{box-shadow:0 0 0 2px #fff7,0 0 34px 12px var(--gc)}}
.yd.gone{filter:grayscale(1) brightness(.45)}.yd.empty{opacity:.3}
#ct{position:absolute;left:40%;top:40%;width:20%;height:20%;pointer-events:none;
 background:conic-gradient(from -45deg,color-mix(in srgb,var(--c1) 80%,#000) 0 90deg,color-mix(in srgb,var(--c2) 80%,#000) 90deg 180deg,color-mix(in srgb,var(--c3) 80%,#000) 180deg 270deg,color-mix(in srgb,var(--c0) 80%,#000) 270deg);box-shadow:0 0 0 1px #000 inset}
.tk{position:absolute;left:0;top:0;width:6.667%;height:6.667%;padding:.6%;z-index:10;cursor:pointer;transition:transform .25s ease;will-change:transform}
.tk span{display:flex;width:100%;height:100%;border-radius:50%;background:var(--gc);color:#000;font-weight:800;font-size:clamp(9px,1.7vw,12px);align-items:center;justify-content:center;border:2px solid #000;box-shadow:0 0 0 1px var(--gc),0 0 8px var(--gc)}
.tk.tn span{box-shadow:0 0 0 1px #fff,0 0 12px 3px var(--gc)}
.tk.bk span{box-shadow:0 0 0 2px #ffe45a,0 0 12px 4px #ffd21fcc}
.tk.s{z-index:20}.tk.s span{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--g),0 0 16px 6px var(--g);animation:pl .8s infinite alternate}
@keyframes pl{to{transform:scale(1.2)}}
#bd.sel .tk:not(.s){pointer-events:none}   /* a token is selected: every other click is a destination (even cells holding tokens) */
.dice{display:flex;gap:8px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.d{width:52px;height:52px;padding:6px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);border:1px solid var(--ln2);background:#00140a}
.d i{border-radius:50%;margin:1px}.d i.p{background:var(--mut)}
.d.on{border-color:var(--g);background:#02301a;box-shadow:0 0 12px #00ff6688}.d.on i.p{background:var(--g)}

/* ---------- side panel ---------- */
.tabs{display:flex;gap:4px;padding:3px;border:1px solid var(--ln);margin-bottom:10px}.tabs button{flex:1;border:0}
.seat{border:1px solid var(--ln);border-left:4px solid var(--gc);padding:8px;margin-bottom:9px;background:#00140a}
.seat.t{box-shadow:0 0 0 1px var(--gc) inset,0 0 14px -2px var(--gc);background:#02200f}
.seat.gone{opacity:.5}.seat .row{margin-top:6px}.seat .row:first-child{margin-top:0}
.tp{font-size:11.5px;padding:4px 8px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.dot.on{background:var(--g);box-shadow:0 0 8px var(--g)}.dot.off{background:var(--red);box-shadow:0 0 8px var(--red)}
details{margin-left:4px}summary{cursor:pointer;padding:3px 0;font-weight:600;color:var(--g)}
.in{margin-left:12px;border-left:1px solid var(--ln);padding-left:9px}
.lf{display:flex;align-items:center;gap:8px;margin:4px 0}.lf span{flex:0 0 38%;color:var(--mut);font-size:11.5px;word-break:break-all}.lf input[type=checkbox]{width:18px;height:18px}

/* ---------- toast / boot / lock ---------- */
#ts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#000;color:var(--g);border:1px solid var(--g);padding:8px 16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;max-width:92vw;box-shadow:0 0 16px #00ff6655}#ts.on{opacity:1}
#boot,#lock{position:fixed;inset:0;background:#000;z-index:200;color:var(--g);padding:30px;font-size:13px;line-height:1.7}
#boot{white-space:pre-wrap;transition:opacity .35s}#boot.off{opacity:0;pointer-events:none}
#lock{display:flex;align-items:center;justify-content:center;z-index:210}#lock[hidden]{display:none}
#lock .lk{width:min(360px,92vw);border:1px solid var(--g);padding:22px;box-shadow:0 0 30px #00ff6644}#lock .lk.shake{animation:sk .35s}
@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="mx"></canvas>
<div id="boot"></div>
<div id="lock" hidden><div class="lk"><div class="big">ACCESS REQUIRED</div><p class="hint" id="lkm">&gt; enter admin key</p><input id="pin" type="password" autocomplete="off" placeholder="********"><div class="row" style="margin-top:10px"><button id="lkb" class="on">Authenticate</button></div></div></div>

<header>
 <div class="logo"><i style="background:#ff2e4d;color:#ff2e4d"></i><i style="background:#00e676;color:#00e676"></i><i style="background:#2aa8ff;color:#2aa8ff"></i><i style="background:#ffd400;color:#ffd400"></i></div>
 <b class="brand">LUDO<span>_</span>ADMIN</b>
 <span id="cs" class="chip">connecting</span>
 <span id="cnt" class="chip lv">rooms 0</span>
 <span class="sp"></span>
 <span class="ps"><b>root@ludo</b>:~/rooms$<i class="cur"></i></span>
 <button id="fx" class="tp">FX: ON</button>
</header>
<main>
 <div class="col">
  <aside class="box" data-t="MATCHES"><input id="q" type="text" placeholder="grep match code..."><div class="row seg" id="fl" style="margin-top:8px"></div><div id="ml"></div></aside>
  <aside class="box" data-t="ONLINE QUEUE"><div id="qb"></div></aside>
  <aside class="box" data-t="ACTIVITY LOG"><div id="lgb"></div></aside>
 </div>
 <section class="box" data-t="BOARD" id="mid"><div class="empty">&gt; select a match from the list_</div></section>
 <section class="box" data-t="CONTROL" id="side"></section>
</main><div id="ts"></div>

<script src="js/firebase-config.js"></script>
<script>
'use strict';
const ADMIN_PIN=''; // set a PIN here to require it on load (empty = no PIN)
const TT=30000;     // the game's turn timer (online / custom matches)

// ===== board geometry + position system: identical to the game (game.js) =====
// pos: -1 yard | 0..50 first round track | 51..55 home road | 56 finished | 57+ = Break Safe "kaca" (second round, back on the main track)
const COL=['#ff2e4d','#00e676','#ffd400','#2aa8ff'],CN=['red','green','yellow','blue'],CB=['Red','Green','Yellow','Blue'];
const SEG=[[6,1,0,1,5],[5,6,-1,0,6],[0,7,0,1,2],[1,8,1,0,5],[6,9,0,1,6],[7,14,1,0,2],[8,13,0,-1,5],[9,8,1,0,6],[14,7,0,-1,2],[13,6,-1,0,5],[8,5,0,-1,6],[7,0,-1,0,2]];
const PATH=[];SEG.forEach(([r,c,dr,dc,k])=>{for(let i=0;i<k;i++)PATH.push([r+dr*i,c+dc*i])});
const HB=[[7,1,0,1],[1,7,1,0],[7,13,0,-1],[13,7,-1,0]],YB=[[0,0],[0,9],[9,9],[9,0]];
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const PI={},HC={};PATH.forEach(([r,c],i)=>PI[r+','+c]=i);HB.forEach(([r,c,dr,dc],i)=>{for(let k=0;k<5;k++)HC[(r+dr*k)+','+(c+dc*k)]=[i,51+k]});
const onTr=p=>p>=0&&(p<=50||p>=57);                                  // on the main track?
const cellOf=(col,p)=>(p<=50?p+13*col:p-6+13*col)%52;                // PATH index of a token
const mOf=p=>p<=50?p-50:p-56,gateOf=m=>m>0?52*Math.ceil(m/52):0;
const SAFE=a=>a%13===0||a%13===8;
function dest(p,d){                                                  // same as game dest() without Break Safe: -2 = no move
 if(p<0)return d===6?0:-2;
 if(p>=51&&p<=56)return p+d<=56?p+d:-2;
 const m=mOf(p),g=gateOf(m),n=m+d;
 if(n<=g)return p<=50?p+d:56+n;
 return 50+n-g}
function xy(col,p,t){
 if(p<0){const[a,b]=YB[col];return[a+(t<2?1.5:3.5),b+(t%2?3.5:1.5)]}
 if(onTr(p))return PATH[cellOf(col,p)];
 const[r,c,dr,dc]=HB[col],k=p-51;return[r+dr*k,c+dc*k]}
const posTxt=p=>p<0?'Yard':p===56?'Home':p>56?'Round 2 · step '+(p-56):p>50?'Home path '+(p-50):'Step '+p;

// ===== helpers / state =====
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let db=null,R={},sel='',tk=null,tab='p',flt='all',auto=false,SO=0,MK='',TKE={},PEND=0;
const DS={},LOGS=[],SIG={l:'',q:'',m:'',s:''};
const sNow=()=>Date.now()+SO,room=()=>R[sel],gs=()=>room()&&room().gameState;
const arr=(x,n)=>Array.from({length:n||(x?Object.keys(x).length:0)},(_,i)=>x?x[i]:undefined);
const fmtAge=ms=>ms<0||!isFinite(ms)?'-':ms<2000?'now':ms<60000?Math.floor(ms/1000)+'s':ms<3600000?Math.floor(ms/60000)+'m':Math.floor(ms/3600000)+'h';
const toast=m=>{const e=$('ts');e.textContent='> '+m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)};
function log(m,k){const d=new Date(),p=n=>String(n).padStart(2,'0');LOGS.push('<div class="'+(k||'')+'"><span class="tm">'+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'</span> '+esc(m)+'</div>');if(LOGS.length>80)LOGS.shift();const e=$('lgb');e.innerHTML=LOGS.join('');e.scrollTop=e.scrollHeight}
const say=(m,k)=>{toast(m);log(m,k)};
const fail=e=>say('ERR: '+(e&&e.message||e),'err');
const upd=o=>{const k=sel;return db.ref('rooms/'+k).update(o).catch(fail)},set=(p,v)=>{const k=sel;return db.ref('rooms/'+k+'/'+p).set(v).catch(fail)};

// ===== seats (one per player in the match) =====
function seats(g){
 const n=g.playerCount||arr(g.seatColors).length,ow=g.seatPlayerIndexes||[],rk=g.finishRank||[],rm=g.removedSeats||[];
 return arr(g.seatColors,n).map((cn,i)=>{const col=CN.indexOf(cn);
  return{i,cn,col,ow:ow[i]!=null?ow[i]:i,name:(g.playerNames&&g.playerNames[i])||CB[col]||'?',out:!!rm[i],rk:rk[i]|0,
   pos:arr(g.tokenPositions&&g.tokenPositions[cn],4).map(p=>Number.isFinite(p)?p:-1)}})}
const whoSeat=(g,S)=>g.teamMode&&S[g.currentTurnSeat]&&S[g.currentTurnSeat].pos.every(x=>x===56)?(g.currentTurnSeat+2)%4:g.currentTurnSeat;
const canMove=(g,S)=>{const d=g.currentDice,q=S[whoSeat(g,S)];return d>=1&&d<=6&&!!q&&q.pos.some(p=>p<0?d===6:dest(p,d)>=0)};   // d=0 = nobody has rolled yet
// capture rules (same as the game): block = 2+ tokens of the same side on one cell, star / start cells are safe, Team Up mates don't kill each other
const sideOf=(g,o)=>g.teamMode&&!g.friendlyKill?o%2:o,foeOf=(g,a,o)=>sideOf(g,a)!==sideOf(g,o);
function atCell(S,a,skip){const r=[];S.forEach(s=>{if(s.out)return;s.pos.forEach((x,u)=>{if(skip&&skip[0]===s.i&&skip[1]===u)return;if(onTr(x)&&cellOf(s.col,x)===a)r.push([s.i,u])})});return r}
const isBlk=(g,L)=>{const c={};L.forEach(([o])=>{const k=sideOf(g,o);c[k]=(c[k]||0)+1});return Object.values(c).some(n=>n>1)};
// presence (online rooms): same offline test the game uses
function seatOnline(r,s){const p=r.presence&&r.presence['player'+s.ow];if(!p)return null;const n=sNow(),ls=p.lastSeenServerTime||0;return !((p.isOnline===false&&n-ls>8000)||n-ls>30000)}

  g.fillStyle='rgba(1,10,4,.14)';g.fillRect(0,0,W,H);g.fillStyle='#00ff66';g.font='14px monospace';
  for(let i=0;i<dr.length;i++){g.fillText(CH[Math.random()*CH.length|0],i*16,dr[i]*16);if(dr[i]*16>H&&Math.random()>.975)dr[i]=0;dr[i]++}}
 function apply(){cancelAnimationFrame(raf);B.textContent='FX: '+(on?'ON':'OFF');B.classList.toggle('on',on);cv.style.display=on?'':'none';if(on){size();raf=requestAnimationFrame(frame)}}
 B.onclick=()=>{on=!on;try{localStorage.setItem('ludo_fx',on?'1':'0')}catch(e){}apply()};
 addEventListener('resize',()=>{if(on)size()});apply()})();
(function(){
 const b=$('boot');let seen=0;try{seen=sessionStorage.getItem('ludo_boot')}catch(e){}
 if(seen||matchMedia('(prefers-reduced-motion:reduce)').matches){b.remove();return}
 try{sessionStorage.setItem('ludo_boot','1')}catch(e){}
 const L=['> LUDO_ADMIN v2 // hacker build','> loading firebase sdk ............ [ok]','> mounting rooms/ ................. [ok]','> syncing game protocol v7 ........ [ok]','> access granted_'];let i=0;
 const end=()=>{b.classList.add('off');setTimeout(()=>b.remove(),400)};b.onclick=end;
 (function nx(){if(i<L.length){b.textContent+=L[i++]+'\n';setTimeout(nx,140)}else setTimeout(end,250)})()})();

// ===== Firebase boot (with retry) =====
const V='https://www.gstatic.com/firebasejs/10.12.2/firebase-';
const loadScript=(s,bust)=>new Promise((ok,no)=>{const e=document.createElement('script'),tm=setTimeout(()=>{e.remove();no('timeout')},9000);e.onload=()=>{clearTimeout(tm);ok()};e.onerror=()=>{clearTimeout(tm);e.remove();no('error')};e.src=bust?s+(s.includes('?')?'&':'?')+'r='+Date.now():s;document.head.appendChild(e)});
async function loadSDK(n){
 for(const L of[['lib/firebase-app-compat.js','lib/firebase-database-compat.js'],[V+'app-compat.js',V+'database-compat.js']]){
  if(window.firebase&&firebase.database)break;
  try{for(const u of L){if(/database/.test(u)?(window.firebase&&firebase.database):window.firebase)continue;await loadScript(u,n>0&&u.startsWith('http'))}}catch(e){}}
 return !!(window.firebase&&firebase.database)}
const setCs=(t,c)=>{$('cs').textContent=t;$('cs').className='chip '+c};
function unlock(){return new Promise(ok=>{
 if(!ADMIN_PIN)return ok();
 const L=$('lock'),i=$('pin'),go=()=>{if(i.value===ADMIN_PIN){L.hidden=true;ok()}else{$('lkm').textContent='> ACCESS DENIED';i.value='';const k=L.firstElementChild;k.classList.add('shake');setTimeout(()=>k.classList.remove('shake'),400)}};
 L.hidden=false;i.focus();$('lkb').onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()}})}
(async()=>{
 await unlock();
 for(let n=0;!(await loadSDK(n));n++){setCs('SDK load failed · retry '+(n+1),'no');await sleep(2500)}
 try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);db=firebase.database()}catch(e){setCs('Firebase init error','no');return fail(e)}
 db.ref('.info/serverTimeOffset').on('value',s=>{SO=+s.val()||0});
 let wasOn=false;db.ref('.info/connected').on('value',s=>{const o=!!s.val();setCs(o?'connected':'offline',o?'ok':'no');if(o){log('connected to Firebase','ok');wasOn=true}else if(wasOn)log('connection lost — Firebase will reconnect by itself','warn')});
 db.ref('rooms').on('value',s=>{R=s.val()||{};if(Array.isArray(R)){const o={};R.forEach((v,i)=>{if(v)o[i]=v});R=o}
  if(sel&&!R[sel]){say('match #'+sel+' is gone (finished / cleaned up)','warn');sel='';tk=null}renderAll()},fail);
 setInterval(()=>renderAll(),2000);setInterval(tickLive,1000);
 renderAll(true)})();
</script></body></html>
